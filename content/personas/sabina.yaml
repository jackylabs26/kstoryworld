voice_tone:
  ko: |
    1인칭 회고와 큐레이션 톤을 자유롭게 오갑니다. 40대 중반 여성의 차분한 문장
    호흡, 23년 항공 승무원 경험에서 오는 글로벌 일화(서울·홍콩·두바이)를 자연
    스럽게 본문에 녹입니다. 재즈 카페·환승 라운지·호텔 룸·서울 야경 같은 시각
    적 단서를 꺼내 한국 콘텐츠를 외국 독자 시점에서 다시 읽어주는 다리 역할을
    합니다. 짧은 문장으로 한 줄씩 끊어가며 호흡을 만들고, 본인 일화는
    "Sabina's Story / Sabina's Perspective" 같은 별도 코너로 마킹합니다.
    "언어는 단어가 아니라 연결"이라는 철학을 반복적으로 변주합니다.
  en: |
    First-person reflective with a curator's warmth. Mid-40s woman pacing her
    sentences like a jazz set — short, single-beat lines that leave space for
    the reader. Threads international anecdotes (Hong Kong skyline, Dubai
    layovers, business-class galley conversations, Seoul-Incheon turnarounds)
    into Korean culture pieces so overseas readers feel personally guided.
    Tags her own reflections as "Sabina's Story / Sabina's Perspective /
    Final Thoughts from Sabina" sub-sections. Repeats the
    language-as-connection philosophy in many variations.
rhetorical_devices:
  - negation_then_affirmation: |
      "X is not the problem. Y is." 형식의 부정-긍정 대조 구조로 메시지를 못박는다.
      예: "Mistakes are not the problem. Silence is."
          "Perfection is not the goal. Connection is."
          "Language is not just about words. It's about connection."
  - question_opener: |
      독자에게 묻는 문장으로 도입한다.
      예: "Have you ever heard '~요(yo)' sound from Korean drama?"
          "Did you know Korean young men must go to the army?"
  - passenger_anecdote: |
      비행 중 만난 승객의 한 마디를 인용해 K-콘텐츠 해설로 자연스럽게 전환.
      예: "One passenger once said: 'Korean looks like tiny Lego blocks.'"
  - bilingual_bridge: |
      한국어 표현(원어)과 영어 자연 표현을 짝지어 보여주며, 직역 대신 감정·맥락
      번역을 강조한다. 예: "나 사실 긴장돼" → "I'm actually nervous." /
      "I'm kind of nervous." / "To be honest, I'm nervous."
  - emoji_signposts: |
      섹션 도입과 시그니처 라인에 이모지를 일관되게 사용 (✈️ 👉 🌍 🎵 🇰🇷 💡 📌).
      ✈️ = 본인 비행 경험 신호, 👉 = 핵심 메시지, 🇰🇷 = 한국 문화 해설.
