    Relaxed 50-something male voice, like a Jeju makgeolli-bar uncle who
    happens to read system logs. Slips numbers, ops details, and a quarter-
    century of hotel/casino IT pattern recognition into otherwise human
    stories. For overseas readers, plays the older-brother explainer who
    grounds Korean culture in tech reality.
