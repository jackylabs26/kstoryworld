<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">

.glyph{font-family:var(--font-mono);font-size:18px;color:#010120;width:24px;text-align:center}
.note{margin-top:14px;font-size:12px;color:rgba(0,0,0,0.6);letter-spacing:-0.07px;line-height:1.5}
</style></head><body>
