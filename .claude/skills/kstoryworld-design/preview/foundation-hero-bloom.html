<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:0;background:#fff;margin:0}
.hero{position:relative;height:280px;overflow:hidden;display:flex;align-items:center;padding:0 32px}
.bloom{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.85}
.b1{width:380px;height:380px;background:#ffd6e0;left:-60px;top:-100px}
.b2{width:340px;height:340px;background:#bdbbff;left:200px;top:60px}
.b3{width:280px;height:280px;background:#ffb7a0;right:80px;top:-40px}
.b4{width:300px;height:300px;background:#cfe9ff;right:-40px;top:120px}
.content{position:relative;z-index:1;max-width:540px}
.lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px;margin-bottom:14px;display:inline-block;padding:2px 8px;background:rgba(255,255,255,0.6);border:1px solid rgba(0,0,0,0.08);border-radius:4px}
h1{margin:0;font-family:var(--font-display);font-size:48px;font-weight:500;letter-spacing:-1.44px;line-height:1.05}
.sub{margin:12px 0 0 0;font-size:16px;letter-spacing:-0.16px;max-width:380px;color:rgba(0,0,0,0.7)}
</style></head><body>
<div class="hero">
  <div class="bloom b1"></div>
  <div class="bloom b2"></div>
  <div class="bloom b3"></div>
  <div class="bloom b4"></div>
  <div class="content">
    <span class="lbl">봄 · SPRING</span>
    <h1>Every Korean story, told with care.</h1>
    <p class="sub">Soft pastel blooms — never literal flowers — set the mood.</p>
  </div>
</div>
</body></html>
