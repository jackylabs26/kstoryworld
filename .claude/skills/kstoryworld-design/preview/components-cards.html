<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#f8f8f8}
.row{display:flex;gap:16px}
.card{flex:1;min-width:0}
.card .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px;color:rgba(0,0,0,0.5);margin-bottom:12px}
.card h3{margin:0 0 8px 0;font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-0.22px;line-height:1.15}
.card p{margin:0;font-size:14px;line-height:1.4;color:rgba(0,0,0,0.7);letter-spacing:-0.07px}
.thumb{height:80px;border-radius:4px;margin-bottom:14px}
</style></head><body>
<div class="row">
  <div class="card">
    <div class="thumb" style="background:linear-gradient(135deg,#ffd6e0 0%,#bdbbff 100%)"></div>
    <div class="label">봄 · STORY 01</div>
    <h3>The cherry tree at Donghwasa</h3>
    <p>A monk, a sparrow, and one perfect afternoon in April.</p>
  </div>
  <div class="card">
    <div class="thumb" style="background:linear-gradient(135deg,#f6e0b5 0%,#e76f51 100%)"></div>
    <div class="label">가을 · STORY 14</div>
    <h3>Persimmons on the windowsill</h3>
    <p>How a single jar of jam taught my grandmother to forgive.</p>
  </div>
</div>
</body></html>
