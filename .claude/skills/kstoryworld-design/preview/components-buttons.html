<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dark-strip{margin-top:16px;padding:18px;background:#010120;border-radius:8px;display:flex;gap:12px}
.meta{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:rgba(0,0,0,0.5);margin-top:14px}
</style></head><body>
<div class="row">
  <button class="btn btn-dark">Read the story <span style="opacity:0.7">→</span></button>
  <button class="btn btn-outline">이야기 시작하기</button>
  <button class="btn btn-dark" disabled style="opacity:0.4;cursor:not-allowed">Disabled</button>
</div>
<div class="dark-strip">
  <button class="btn btn-glass">Listen now</button>
  <button class="btn btn-glass" style="background:rgba(255,255,255,0.04)">Subscribe</button>
</div>
<div class="meta">radius 4 · padding 12 / 20 · 240ms ease-out · no scale on press</div>
</body></html>
