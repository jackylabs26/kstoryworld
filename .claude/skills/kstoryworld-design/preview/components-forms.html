<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:420px}
label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px}
input,select{font-family:var(--font-display);font-size:16px;letter-spacing:-0.16px;padding:10px 12px;border:1px solid rgba(0,0,0,0.08);border-radius:4px;background:#fff;color:#000;transition:border-color 240ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 240ms}
input:focus,select:focus{outline:none;border-color:#010120;box-shadow:0 0 0 3px rgba(1,1,32,0.08)}
.checkbox{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:16px;letter-spacing:-0.16px}
.box{width:18px;height:18px;border:1px solid rgba(0,0,0,0.4);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;background:#010120;color:#fff;font-size:12px}
</style></head><body>
<div class="field"><label>Email · 이메일</label><input type="email" placeholder="reader@kstoryworld.com"></div>
<div class="field"><label>Reading level</label><select><option>Beginner · 초급</option><option>Intermediate · 중급</option><option>Native · 모국어</option></select></div>
<div class="checkbox"><span class="box">✓</span><span>Send me one story every Sunday morning.</span></div>
</body></html>
