<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: #ffffff; }
  .season { margin-bottom: 18px; }
  .label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.55px; margin-bottom: 8px; color: rgba(0,0,0,0.6); }
  .label .ko { font-family: var(--font-display); text-transform: none; letter-spacing: -0.16px; color: #000; margin-right: 8px; font-size: 14px; }
  .row { display: flex; gap: 8px; }
  .chip { width: 90px; height: 56px; border-radius: 4px; border: 1px solid var(--border-light); display: flex; align-items: flex-end; padding: 6px 8px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(0,0,0,0.6); }
  .chip.dark { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.12); }
  .grad { width: 188px; height: 56px; border-radius: 4px; border: 1px solid var(--border-light); }
</style></head><body>
<div class="season"><div class="label"><span class="ko">가을</span>AUTUMN — 가을</div><div class="row">
  <div class="chip" style="background:#f6e0b5">#f6e0b5</div>
  <div class="chip" style="background:#f4a261">#f4a261</div>
  <div class="chip dark" style="background:#e76f51">#e76f51</div>
  <div class="grad" style="background:linear-gradient(135deg,#f6e0b5 0%,#f4a261 55%,#e76f51 100%)"></div>
</div></div>
<div class="season"><div class="label"><span class="ko">겨울</span>WINTER — 겨울</div><div class="row">
  <div class="chip" style="background:#f4f4f7">#f4f4f7</div>
  <div class="chip" style="background:#dbe7ff">#dbe7ff</div>
  <div class="chip dark" style="background:#3a4a7d">#3a4a7d</div>
  <div class="grad" style="background:linear-gradient(135deg,#f4f4f7 0%,#dbe7ff 60%,#3a4a7d 100%)"></div>
</div></div>
</body></html>
