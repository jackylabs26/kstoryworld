<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#f4f4f7}
.row{display:flex;gap:18px;align-items:center}
.box{flex:1;padding:18px;background:#fff;border-radius:8px;border:1px solid rgba(0,0,0,0.08);display:flex;flex-direction:column;gap:6px}
.lvl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:rgba(0,0,0,0.5)}
.flat{box-shadow:none}
.l1{}
.l2{box-shadow:0 4px 10px rgba(1,1,32,0.10)}
.l3{box-shadow:0 8px 24px rgba(1,1,32,0.16)}
</style></head><body>
<div class="row">
  <div class="box flat"><div class="lvl">L0 · flat</div><div>no shadow</div></div>
  <div class="box l1"><div class="lvl">L1 · contained</div><div>1px border</div></div>
  <div class="box l2"><div class="lvl">L2 · elevated</div><div>4·10 · midnight 10%</div></div>
  <div class="box l3"><div class="lvl">L3 · hover</div><div>8·24 · midnight 16%</div></div>
</div>
</body></html>
