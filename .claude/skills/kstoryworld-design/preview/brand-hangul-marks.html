<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff;display:flex;gap:14px}
.tile{flex:1;height:160px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tile img{height:120px}
.cap{position:absolute;left:12px;bottom:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:rgba(0,0,0,0.6)}
.t1{background:#fff5f7}
.t2{background:#f0faf8}
.t3{background:#fdf3e6}
.t4{background:#010120}
.t4 .cap{color:rgba(255,255,255,0.7)}
</style></head><body>
<div class="tile t1"><img src="../assets/hangul-mark-spring.svg"><div class="cap">봄 · spring</div></div>
<div class="tile t2"><img src="../assets/hangul-mark-summer.svg"><div class="cap">여름 · summer</div></div>
<div class="tile t3"><img src="../assets/hangul-mark-autumn.svg"><div class="cap">가을 · autumn</div></div>
<div class="tile t4"><img src="../assets/hangul-mark-winter.svg"><div class="cap">겨울 · winter</div></div>
</body></html>
