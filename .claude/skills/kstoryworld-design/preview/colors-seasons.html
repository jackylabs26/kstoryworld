<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.season{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border-light);margin-bottom:16px}
.s-band{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.s-band .h{font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;text-transform:uppercase}
.s-name{font-family:var(--font-display);font-size:24px;font-weight:500;letter-spacing:-0.6px;width:140px;display:flex;align-items:center;padding:0 16px;background:#fff;border-right:1px solid var(--border-light)}
.s-name small{font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:rgba(0,0,0,0.5);display:block;margin-top:2px}
</style></head><body>
<div class="season">
  <div class="s-name">봄<small>spring</small></div>
  <div class="s-band" style="background:#ffd6e0"><div class="h">#FFD6E0</div></div>
  <div class="s-band" style="background:#ffb7a0"><div class="h">#FFB7A0</div></div>
  <div class="s-band" style="background:#bdbbff"><div class="h">#BDBBFF</div></div>
  <div class="s-band" style="background:linear-gradient(135deg,#ffd6e0 0%,#ffb7a0 50%,#bdbbff 100%)"><div class="h" style="color:#fff;mix-blend-mode:difference">grad</div></div>
</div>
<div class="season">
  <div class="s-name">여름<small>summer</small></div>
  <div class="s-band" style="background:#cfe9ff"><div class="h">#CFE9FF</div></div>
  <div class="s-band" style="background:#7fd1c7"><div class="h">#7FD1C7</div></div>
  <div class="s-band" style="background:#d8f3dc"><div class="h">#D8F3DC</div></div>
  <div class="s-band" style="background:linear-gradient(135deg,#cfe9ff 0%,#7fd1c7 50%,#d8f3dc 100%)"><div class="h" style="color:#fff;mix-blend-mode:difference">grad</div></div>
</div>
<div class="season">
  <div class="s-name">가을<small>autumn</small></div>
  <div class="s-band" style="background:#f6e0b5"><div class="h">#F6E0B5</div></div>
  <div class="s-band" style="background:#f4a261"><div class="h">#F4A261</div></div>
  <div class="s-band" style="background:#e76f51"><div class="h" style="color:#fff">#E76F51</div></div>
  <div class="s-band" style="background:linear-gradient(135deg,#f6e0b5 0%,#f4a261 55%,#e76f51 100%)"><div class="h" style="color:#fff;mix-blend-mode:difference">grad</div></div>
</div>
<div class="season">
  <div class="s-name">겨울<small>winter</small></div>
  <div class="s-band" style="background:#f4f4f7"><div class="h">#F4F4F7</div></div>
  <div class="s-band" style="background:#dbe7ff"><div class="h">#DBE7FF</div></div>
  <div class="s-band" style="background:#3a4a7d"><div class="h" style="color:#fff">#3A4A7D</div></div>
  <div class="s-band" style="background:linear-gradient(135deg,#f4f4f7 0%,#dbe7ff 60%,#3a4a7d 100%)"><div class="h" style="color:#fff;mix-blend-mode:difference">grad</div></div>
</div>
</body></html>
