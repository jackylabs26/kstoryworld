<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.season-tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px;border:1px solid rgba(0,0,0,0.08)}
.dot{width:6px;height:6px;border-radius:50%}
.dark{margin-top:6px;padding:14px;background:#010120;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<div class="row">
  <span class="badge">NEW · 신작</span>
  <span class="badge">FEATURED</span>
  <span class="badge">FREE</span>
  <span class="badge" style="background:#fff">PREMIUM</span>
</div>
<div class="row">
  <span class="season-tag" style="background:#ffd6e0"><span class="dot" style="background:#c2185b"></span>봄 · spring</span>
  <span class="season-tag" style="background:#cfe9ff"><span class="dot" style="background:#1e6f6a"></span>여름 · summer</span>
  <span class="season-tag" style="background:#f6e0b5"><span class="dot" style="background:#8a3a1a"></span>가을 · autumn</span>
  <span class="season-tag" style="background:#dbe7ff"><span class="dot" style="background:#1c2750"></span>겨울 · winter</span>
</div>
<div class="dark">
  <span class="badge badge-dark">NEW</span>
  <span class="badge badge-dark">RESEARCH</span>
  <span class="badge badge-dark">EPISODE 04</span>
</div>
</body></html>
