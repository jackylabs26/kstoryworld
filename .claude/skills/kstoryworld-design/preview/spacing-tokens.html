<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.row{display:flex;gap:14px;align-items:flex-end;margin-bottom:12px}
.bar{background:#010120;border-radius:2px}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:rgba(0,0,0,0.6);margin-top:6px}
.r{display:flex;flex-direction:column;align-items:center}
.radius-row{display:flex;gap:18px;margin-top:18px}
.rad{width:64px;height:64px;background:#010120}
</style></head><body>
<div class="row">
  <div class="r"><div class="bar" style="width:1px;height:40px"></div><div class="lbl">1</div></div>
  <div class="r"><div class="bar" style="width:2px;height:40px"></div><div class="lbl">2</div></div>
  <div class="r"><div class="bar" style="width:4px;height:40px"></div><div class="lbl">4</div></div>
  <div class="r"><div class="bar" style="width:8px;height:40px"></div><div class="lbl">8</div></div>
  <div class="r"><div class="bar" style="width:12px;height:40px"></div><div class="lbl">12</div></div>
  <div class="r"><div class="bar" style="width:16px;height:40px"></div><div class="lbl">16</div></div>
  <div class="r"><div class="bar" style="width:24px;height:40px"></div><div class="lbl">24</div></div>
  <div class="r"><div class="bar" style="width:32px;height:40px"></div><div class="lbl">32</div></div>
  <div class="r"><div class="bar" style="width:48px;height:40px"></div><div class="lbl">48</div></div>
  <div class="r"><div class="bar" style="width:80px;height:40px"></div><div class="lbl">80</div></div>
  <div class="r"><div class="bar" style="width:120px;height:40px"></div><div class="lbl">120</div></div>
</div>
<div class="radius-row">
  <div class="r"><div class="rad" style="border-radius:0"></div><div class="lbl">flat · 0</div></div>
  <div class="r"><div class="rad" style="border-radius:4px"></div><div class="lbl">sharp · 4</div></div>
  <div class="r"><div class="rad" style="border-radius:8px"></div><div class="lbl">card · 8</div></div>
</div>
</body></html>
