<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff;display:flex;gap:20px;align-items:center}
.logo-block{display:flex;flex-direction:column;gap:14px}
.bg-dark{padding:24px 32px;background:#010120;border-radius:8px;display:flex;align-items:center}
img{display:block;height:36px}
.mark-row{display:flex;gap:14px;align-items:center}
.mark{width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:32px;font-weight:500;letter-spacing:-0.96px;background:#010120;color:#fff;position:relative}
.mark::after{content:'';position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:#ef2cc1}
</style></head><body>
<div class="logo-block">
  <img src="../assets/logo-kstoryworld.svg" alt="logo">
  <div class="bg-dark"><img src="../assets/logo-kstoryworld.svg" style="filter:invert(1) hue-rotate(180deg);height:30px"></div>
</div>
<div class="mark-row">
  <div class="mark">K·</div>
  <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px;color:rgba(0,0,0,0.6)">app icon · favicon · 64×64</div>
</div>
</body></html>
