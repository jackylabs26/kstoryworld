<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#fff}
.row{display:flex;gap:12px}
.sw{flex:1}
.chip{height:120px;border-radius:8px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px}
.cap{margin-top:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;text-transform:uppercase;color:rgba(0,0,0,0.6)}
.note{margin-top:16px;font-size:13px;color:rgba(0,0,0,0.6);letter-spacing:-0.13px}
h4{margin:0 0 14px 0;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.55px;font-weight:500}
</style></head><body>
<h4>Brand accents · illustration only · never UI chrome</h4>
<div class="row">
  <div class="sw"><div class="chip" style="background:#ef2cc1">#EF2CC1</div><div class="cap">brand magenta</div></div>
  <div class="sw"><div class="chip" style="background:#fc4c02">#FC4C02</div><div class="cap">brand orange</div></div>
  <div class="sw"><div class="chip" style="background:#bdbbff;color:#1c2750">#BDBBFF</div><div class="cap">soft lavender</div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(135deg,#ef2cc1 0%,#fc4c02 100%)">grad</div><div class="cap">magenta → orange</div></div>
</div>
<div class="note">⚠ Magenta &amp; orange appear in pastel illustrations and gradient endpoints only — never as button fill, link, or text.</div>
</body></html>
