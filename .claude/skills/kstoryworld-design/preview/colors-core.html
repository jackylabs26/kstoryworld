<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: #ffffff; }
  .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
  .swatch { width: 140px; border-radius: 4px; border: 1px solid var(--border-light); overflow: hidden; }
  .chip { height: 80px; }
  .meta { padding: 8px 10px; }
  .meta .name { font-family: var(--font-display); font-size: 14px; letter-spacing: -0.14px; }
  .meta .hex { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(0,0,0,0.5); margin-top: 2px; }
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#ffffff;border-bottom:1px solid var(--border-light)"></div><div class="meta"><div class="name">Canvas Light</div><div class="hex">#ffffff</div></div></div>
  <div class="swatch"><div class="chip" style="background:#010120"></div><div class="meta"><div class="name">Canvas Dark</div><div class="hex">#010120 · midnight</div></div></div>
  <div class="swatch"><div class="chip" style="background:#000000"></div><div class="meta"><div class="name">FG on Light</div><div class="hex">#000000</div></div></div>
  <div class="swatch"><div class="chip" style="background:#ef2cc1"></div><div class="meta"><div class="name">Brand Magenta</div><div class="hex">#ef2cc1 · illust only</div></div></div>
  <div class="swatch"><div class="chip" style="background:#fc4c02"></div><div class="meta"><div class="name">Brand Orange</div><div class="hex">#fc4c02 · illust only</div></div></div>
  <div class="swatch"><div class="chip" style="background:#bdbbff"></div><div class="meta"><div class="name">Lavender</div><div class="hex">#bdbbff</div></div></div>
</div>
</body></html>
